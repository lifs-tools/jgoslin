# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main, release ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: 'true'
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set Git user
      run: |
        git config --global committer.email "noreply@github.com"
        git config --global committer.name "GitHub"
        git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global author.name "${GITHUB_ACTOR}"
    - name: Set Release version env variable
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # let the wrapper download Maven first, its progress output would otherwise end up in RELEASE_VERSION
        ./mvnw -q -v > /dev/null
        echo "RELEASE_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\n')" >> $GITHUB_ENV
    - name: Restore Maven cache
      uses: skjolber/maven-cache-github-action@v3.1.2
      with:
        step: restore
    - name: Build with Maven
      env:
        USERNAME: ${{ github.actor }}
        PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: ./mvnw -B package --file pom.xml
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "**/*-reports/*.xml"
    # Deploy to Artifactory only on pushes to main and release, not for pull requests.
    - uses: jfrog/setup-jfrog-cli@v5
      if: github.event_name == 'push'
    - name: Deploy to Artifactory
      if: github.event_name == 'push'
      env:
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      # ARTIFACTORY_TOKEN only works as github-deployer's password (bearer use gives 401).
      # --basic-auth-only stops the CLI from exchanging it for a new token (400 for reference
      # tokens); --enc-password=false skips the password encryption call.
      run: |
            printf '%s' "$ARTIFACTORY_TOKEN" | jf c add lifs-tools --url=https://m.lifs-tools.org/ --user=github-deployer --password-stdin --basic-auth-only --enc-password=false --interactive=false --overwrite
            jf c use lifs-tools
            jf mvn-config --repo-deploy-releases=lifs-libs-release-local --repo-deploy-snapshots=lifs-libs-snapshot-local
            jf mvn -B deploy -DskipTests -Pjfrog --file pom.xml
            jf rt bp
    - name: Save Maven cache
      uses: skjolber/maven-cache-github-action@v3.1.2
      with:
        step: save
